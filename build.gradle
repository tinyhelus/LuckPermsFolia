plugins {
    alias(libs.plugins.licenser) apply false
}

import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

defaultTasks 'licenseFormat', 'build'

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'org.cadixdev.licenser'

    group = 'me.lucko.luckperms'
    version = '5.5-SNAPSHOT'

    sourceCompatibility = 11
    targetCompatibility = 11

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        testLogging {
            events = [TestLogEvent.PASSED, TestLogEvent.FAILED, TestLogEvent.SKIPPED]
            exceptionFormat = TestExceptionFormat.FULL
            showExceptions = true
            showCauses = true
            showStackTraces = true
        }
    }

    jar {
        from '../LICENSE.txt'
    }

def determinePatchVersion = {
    // get the name of the last tag
    def tagInfo = new ByteArrayOutputStream()
    def gitExitValue = 0 // Initialize exit value

    try {
        exec {
            commandLine 'git', 'describe', '--tags'
            standardOutput = tagInfo
            ignoreExitValue = true // <--- ADD THIS LINE
            doLast {
                gitExitValue = it.exitValue
            }
        }
    } catch (Exception e) {
        // If 'git' command itself is not found, we return 0.
        return 0 
    }

    // If git failed (exit value 128) because there were no tags, return 0.
    if (gitExitValue != 0 || tagInfo.toString().trim().isEmpty()) {
        return 0
    }

    def tagString = tagInfo.toString().trim()

    if (!tagString.contains('-')) {
        return 0
    }
    return tagString.split("-")[1].toInteger()
}

    project.ext.majorVersion = '5'
    project.ext.minorVersion = '5'
    project.ext.patchVersion = determinePatchVersion()
    project.ext.apiVersion = project.ext.majorVersion + '.' + project.ext.minorVersion
    project.ext.fullVersion = project.ext.apiVersion + '.' + project.ext.patchVersion

    license {
        header = rootProject.file('HEADER.txt')
        include '**/*.java'
        newLine = true
    }

    repositories {
        // Fix issue with lwjgl-freetype not being found on macOS / ForgeGradle issue
        //
        // Could not resolve all files for configuration ':_compileJava_1'.
        // Could not find lwjgl-freetype-3.3.3-natives-macos-patch.jar (org.lwjgl:lwjgl-freetype:3.3.3).
        maven {
            url "https://libraries.minecraft.net"
            content {
                includeModule("org.lwjgl", "lwjgl-freetype")
            }
        }
        mavenCentral()
        maven { url 'https://repo.lucko.me/' }
        maven { url 'https://libraries.minecraft.net/' }
    }
}
